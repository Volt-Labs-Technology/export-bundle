[package]
name = "export-bundle"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Copy CSV files keeping only caller-supplied columns, refuse headers that name people or machines, and write a verifiable SHA-256 manifest."
repository = "https://github.com/Volt-Labs-Technology/export-bundle"
homepage = "https://github.com/Volt-Labs-Technology/export-bundle"
documentation = "https://docs.rs/export-bundle"
readme = "README.md"
license = "MIT"
keywords = ["csv", "manifest", "sha256", "export", "anonymize"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "1"

[features]
default = []
cli = []

[[bin]]
name = "export-bundle"
path = "src/bin/export-bundle.rs"
required-features = ["cli"]
